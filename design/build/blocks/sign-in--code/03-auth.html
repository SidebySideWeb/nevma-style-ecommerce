<!-- Sign in · code step (Shopify-hosted, reference) · block "auth" · exact markup from the design (classes + inline styles). Port to a component without changing values. -->
<div class="s-form" data-block="auth">
<div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px">




<form style="display: flex; flex-direction: column; gap: 22px">
<p class="s-eb">Step 2 of 2</p>
<h1 class="s-disp" style="margin: 0; font-size: clamp(26px, 2.6vw, 36px); letter-spacing: 0.22em">Check your email</h1>
<p style="margin: 0; color: #3E3B35">We sent a 6-digit code to <strong>alex.morgan@example.com</strong>. It works for 10 minutes.</p>
<div><label for="a-code" class="s-lbl">Code</label><input id="a-code" class="s-in s-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="482 913"></div>
<button type="submit" class="s-btn s-btn-p" style="width: 100%">Continue</button>
<div style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap"><button type="button" class="s-txt">Use a different email</button><button type="button" class="s-txt">Send a new code</button></div>
</form>




</div>
</div>
