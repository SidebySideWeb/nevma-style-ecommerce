<!-- Sign in · block "auth" · exact markup from the design (classes + inline styles). Port to a component without changing values. -->
<div class="s-form" data-block="auth">
<div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px">


<div style="display: flex; flex-direction: column; gap: 28px">
<h1 class="s-disp" style="margin: 0; font-size: clamp(26px, 2.6vw, 36px); letter-spacing: 0.22em">Sign in</h1>
<div role="tablist" aria-label="Account" style="display: flex">
<button type="button" role="tab" class="s-tab" aria-selected="true">Sign in</button>
<button type="button" role="tab" class="s-tab" aria-selected="false">Create account</button>
</div>
<form style="display: flex; flex-direction: column; gap: 18px">

<div><label for="a-email" class="s-lbl">Email</label><input id="a-email" class="s-in" type="email" autocomplete="email" value="alex.morgan@example.com"></div>

<button type="submit" class="s-btn s-btn-p" style="width: 100%">Email me a code</button>
<p style="margin: 0; font-size: 14px; color: #3E3B35">No password. We email you a 6-digit code each time you sign in. New here? The same code creates your account.</p>
</form>
</div>






</div>
</div>
