<!-- Create account · block "why-have-an-account" · exact markup from the design (classes + inline styles). Port to a component without changing values. -->

<div style="position: relative; height: 100%; box-sizing: border-box; padding: 64px 48px; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px">
<p class="s-eb" style="color: #F0E81C">With an account</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">

<li style="padding: 16px 0; border-block: 1px solid #34343C; display: flex; flex-direction: column; gap: 2px"><span class="s-name" style="font-size: 12.5px">Faster checkout</span><span style="font-size: 15px; color: #D2D2DA">Your address is filled in for you.</span></li>
</ul>
